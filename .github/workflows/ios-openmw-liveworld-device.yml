name: iOS OpenMW G6 genuine live-world ownership (manual private import)

# Manual review/run only. CI never installs or runs the device application.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERIMENT: experiments/ios-openmw-nif-render-smoke
  TEXTURED: experiments/ios-openmw-nif-render-smoke/textured
  WORLD: experiments/ios-openmw-world-smoke
  ENGINE: experiments/ios-openmw-engine-smoke
  LIVEWORLD: experiments/ios-openmw-liveworld-smoke
  OPENMW_SOURCE: ${{ github.workspace }}/openmw
  OPENMW_ESM_OSG_SOURCE: ${{ github.workspace }}/osg-pinned
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  host-regressions:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize failure evidence before checkout
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/openmw-g4-host-evidence"
          BUILD_DIR="$RUNNER_TEMP/openmw-g4-host-build"
          BULLET_ROOT="$RUNNER_TEMP/openmw-g1a-bullet"
          mkdir -p "$EVIDENCE"
          printf 'EVIDENCE=%s\nBUILD_DIR=%s\nBULLET_ROOT=%s\n' \
            "$EVIDENCE" "$BUILD_DIR" "$BULLET_ROOT" >> "$GITHUB_ENV"
          printf 'Requested %s at %s\n' "$GITHUB_REF" "$GITHUB_SHA" > "$EVIDENCE/request.txt"

      - name: Check out requested source and read-only baseline history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: openmw
          fetch-depth: 0
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Check out exact pinned OSG source
        uses: actions/checkout@v6
        with:
          repository: OpenMW/osg
          ref: 9b384d5439977784e5cd250ff8ff7966928ddd27
          path: osg-pinned
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Verify host, preservation, source and fixture contracts
        id: sources
        run: |
          set -euo pipefail
          {
            test "$GITHUB_REF" = refs/heads/ios-port
            test "$(git -C "$OPENMW_SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(uname -m)" = arm64
            sw_vers
            xcodebuild -version
            xcrun --sdk macosx clang++ --version
            cmake --version
            python3 --version
          } 2>&1 | tee "$EVIDENCE/toolchain.log"
          python3 "$OPENMW_SOURCE/$EXPERIMENT/tools/contracts.py" \
            --osg-source "$OPENMW_ESM_OSG_SOURCE" > "$EVIDENCE/source-audit.json" \
            2> "$EVIDENCE/source-audit-errors.log"
          python3 "$OPENMW_SOURCE/$EXPERIMENT/device/tools/provenance.py" audit --osg-reference "$OPENMW_ESM_OSG_SOURCE" > "$EVIDENCE/g1b-source-audit.json"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$EXPERIMENT/device/tools" -p test_g1b.py -v 2>&1 | tee "$EVIDENCE/g1b-tests.log"
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/resources.py" audit --osg-reference "$OPENMW_ESM_OSG_SOURCE" > "$EVIDENCE/g1c-source-audit.json"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$TEXTURED/tools" -p test_g1c.py -v 2>&1 | tee "$EVIDENCE/g1c-tests.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$EXPERIMENT/tools" -p test_g1a.py -v \
            2>&1 | tee "$EVIDENCE/offline-tests.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/experiments/ios-openmw-nif-smoke/tools" -p test_g0_ci.py -v \
            2>&1 | tee "$EVIDENCE/g0b-regressions.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/experiments/ios-openmw-nif-device-smoke/tools" -p test_g0c.py -v \
            2>&1 | tee "$EVIDENCE/g0c-regressions.log"

      - name: G3 source and controller-first offline regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "$OPENMW_SOURCE/experiments/ios-openmw-exterior-smoke/tools" -p test_g3.py -v 2>&1 | tee "$EVIDENCE/g3-offline.log"
          python3 "$OPENMW_SOURCE/experiments/ios-openmw-exterior-smoke/tools/paths.py" > "$EVIDENCE/g3-preservation.json"

      - name: Restore source archives only (every SHA-512 is rechecked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # official v5
        with:
          path: ${{ runner.temp }}/openmw-g4-dependencies/*.zip
          key: g4-source-v1-${{ hashFiles('openmw/experiments/ios-openmw-world-smoke/dependencies.json') }}
      - name: Verify G4 sources and regressions; acquire exact upstream source inputs
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$WORLD/tools/paths.py" > "$EVIDENCE/g4-preservation.json"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$WORLD/tools" -p test_g4.py -v 2>&1 | tee "$EVIDENCE/g4-offline.log"
          python3 "$OPENMW_SOURCE/$WORLD/tools/prepare_dependencies.py" --output "$RUNNER_TEMP/openmw-g4-dependencies" \
            > "$EVIDENCE/g4-dependencies.json" 2> "$EVIDENCE/g4-dependency-errors.log"
      - name: Early iPhoneOS framework compilation and link preflight
        id: sdk_probe
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/experiments/ios-openmw-exterior-smoke/tools/device_sdk_check.py" \
            --output "$EVIDENCE/sdk-probe" > "$EVIDENCE/sdk-probe.json" 2> "$EVIDENCE/sdk-probe-errors.log"

      - name: Acquire and verify unchanged Bullet 3.25 source
        id: bullet
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/experiments/ios-openmw-nif-smoke/tools/prepare_bullet.py" --download \
            --output "$BULLET_ROOT" --evidence "$EVIDENCE" 2>&1 | tee "$EVIDENCE/bullet-acquisition.log"

      - name: Configure single-provider native textured resource harness
        id: configure
        run: |
          set -euo pipefail
          cmake -S "$OPENMW_SOURCE/$TEXTURED" -B "$BUILD_DIR" -G 'Unix Makefiles' \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DOPENMW_ESM_OSG_SOURCE="$OPENMW_ESM_OSG_SOURCE" \
            -DG0_BULLET_SOURCE="$BULLET_ROOT/source" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_CXX_COMPILER="$(xcrun --sdk macosx --find clang++)" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$EVIDENCE/configure.log"
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/resources.py" host-configured --osg-reference "$OPENMW_ESM_OSG_SOURCE" \
            --build "$BUILD_DIR" --bullet "$BULLET_ROOT/source" > "$EVIDENCE/configured-audit.json" \
            2> "$EVIDENCE/configured-audit-errors.log"

      - name: Compile and inspect actual ARM64 host products
        id: build
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target openmw-textured-nif-check openmw-nif-geometry-check openmw-nif-parse-check --parallel 4 \
            2>&1 | tee "$EVIDENCE/build.log"
          test "$(wc -l < "$BUILD_DIR/g1c-host-products-Release.txt")" -eq 3
          while IFS= read -r product; do
            test -f "$product" && test -x "$product" && test ! -L "$product"
            test "$(xcrun lipo -archs "$product")" = arm64
            shasum -a 256 "$product" >> "$EVIDENCE/executables-sha256.txt"
            otool -L "$product" >> "$EVIDENCE/executable-dependencies.txt"
          done < "$BUILD_DIR/g1c-host-products-Release.txt"

      - name: Execute textured ownership/negative gates and preserved geometry/parser suites
        id: runtime
        run: |
          set -euo pipefail
          ctest --test-dir "$BUILD_DIR/g1a" -R '^g1a-' --no-tests=error \
            --output-on-failure -V 2>&1 | tee "$EVIDENCE/g1a-native-tests.log"
          ctest --test-dir "$BUILD_DIR" -R '^g1c-' --no-tests=error \
            --output-on-failure -V 2>&1 | tee "$EVIDENCE/native-tests.log"

      - name: Configure G4 genuine shared host provider
        id: g4_host_configure
        run: |
          set -euo pipefail
          REAL="$OPENMW_SOURCE/$WORLD"
          G1D="$OPENMW_SOURCE/experiments/ios-openmw-nif-render-smoke/real-model"
          python3 -m unittest discover -s "$G1D/tools" -p test_g1d.py -v 2>&1 | tee "$EVIDENCE/g1d-offline.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/experiments/ios-openmw-interior-smoke/tools" -p test_g2.py -v 2>&1 | tee "$EVIDENCE/g2-offline.log"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/preserve.py" > "$EVIDENCE/g5-preservation.json"
          python3 "$OPENMW_SOURCE/$ENGINE/tools/acquire.py" --output "$RUNNER_TEMP/openmw-g5-dependencies" > "$EVIDENCE/g5-lua-source.log"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/dependencies.py" --output "$RUNNER_TEMP/openmw-g6-dependencies" > "$EVIDENCE/g6-source-dependencies.json"
          G6_MYGUI_HEADERS="$RUNNER_TEMP/openmw-g4-dependencies/mygui/MyGUIEngine/include" python3 -m unittest discover -s "$OPENMW_SOURCE/$LIVEWORLD/tools" -p test_g6.py -v 2>&1 | tee "$EVIDENCE/g6-offline.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$ENGINE/tools" -p test_g5.py -v 2>&1 | tee "$EVIDENCE/g5-offline.log"
          cmake -S "$REAL" -B "$RUNNER_TEMP/g4-host-build" -G 'Unix Makefiles' \
            -DCMAKE_PROJECT_OpenMWWorldIntegration_INCLUDE="$OPENMW_SOURCE/$LIVEWORLD/cmake/attach_host.cmake" \
            -DG5_LUA_SOURCE="$RUNNER_TEMP/openmw-g5-dependencies/lua-5.4.9" \
            -DG6_DEPENDENCIES_SOURCE="$RUNNER_TEMP/openmw-g6-dependencies" \
            -DG4_DEPENDENCIES_SOURCE="$RUNNER_TEMP/openmw-g4-dependencies" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DOPENMW_ESM_OSG_SOURCE="$OPENMW_ESM_OSG_SOURCE" -DG0_BULLET_SOURCE="$BULLET_ROOT/source" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$EVIDENCE/g2-host-configure.log"
          python3 "$REAL/tools/provenance.py" --configured "$RUNNER_TEMP/g4-host-build" \
            > "$EVIDENCE/g3-host-bullet-audit.json" 2> "$EVIDENCE/g3-host-bullet-audit-errors.log"
      - name: Early G4 headless startup lifecycle gate
        id: g4_startup
        run: |
          set -euo pipefail
          # Reuse the same OSG targets; do not wait for the G4 world/image closure.
          cmake --build "$RUNNER_TEMP/g4-host-build" --target openmw-g4-startup-check --parallel 4 2>&1 | tee "$EVIDENCE/g4-startup-build.log"
          ctest --test-dir "$RUNNER_TEMP/g4-host-build" -R '^g4-startup-capabilities$' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g4-startup-tests.log"
      - name: G4 genuine host regressions with all accepted G1D G2 G3 suites
        id: g4_host
        run: |
          set -euo pipefail
          # Accepted harnesses and G4 share the same pinned OSG/Bullet provider.
          cmake --build "$RUNNER_TEMP/g4-host-build" --target openmw-world-check openmw-g4-osg-registration-check openmw-exterior-check openmw-interior-check openmw-real-model-check --parallel 4 2>&1 | tee "$EVIDENCE/g4-host-build.log"
          ctest --test-dir "$RUNNER_TEMP/g4-host-build/provider/interior/provider" -R '^g1d-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g1d-native-tests.log"
          ctest --test-dir "$RUNNER_TEMP/g4-host-build/provider/interior" -R '^g2-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g2-native-tests.log"
          ctest --test-dir "$RUNNER_TEMP/g4-host-build/provider" -R '^g3-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g3-native-tests.log"
          ctest --test-dir "$RUNNER_TEMP/g4-host-build" -R '^g4-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g4-native-tests.log"

      - name: G5 genuine engine content and world regressions
        id: g5_host
        run: |
          set -euo pipefail
          REAL_BUILD="$RUNNER_TEMP/g4-host-build"
          cmake --build "$REAL_BUILD" --target openmw-g5-store-check openmw-engine-check --parallel 4 2>&1 | tee "$EVIDENCE/g5-host-build.log"
          ctest --test-dir "$REAL_BUILD" -R '^g5-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g5-native-tests.log"
          python3 - "$REAL_BUILD/g4-startup-case.json" <<'PY2'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          assert len(rows)==1 and rows[0]['status']=='PASS'
          assert json.loads(rows[0]['stdout'])['checks']==29
          PY2

      - name: G6 genuine CellStore ownership, Scene interface and live renderer gates
        id: g6_host
        run: |
          set -euo pipefail
          REAL_BUILD="$RUNNER_TEMP/g4-host-build"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/audit.py" --build "$REAL_BUILD" > "$EVIDENCE/g6-configured.json"
          cmake --build "$REAL_BUILD" --target openmw-g6-live-check openmw-g6-world-check openmw-g6-render-check g6-scene-compile --parallel 3 2>&1 | tee "$EVIDENCE/g6-host-build.log"
          ctest --test-dir "$REAL_BUILD" -R '^g6-' --no-tests=error -V 2>&1 | tee "$EVIDENCE/g6-native-tests.log"

      - name: Retain diagnostics and separate gate outcomes even on failure
        if: always()
        env:
          SOURCE_GATE: ${{ steps.sources.outcome }}
          BULLET_GATE: ${{ steps.bullet.outcome }}
          CONFIGURE_GATE: ${{ steps.configure.outcome }}
          BUILD_GATE: ${{ steps.build.outcome }}
          RUNTIME_GATE: ${{ steps.runtime.outcome }}
          G4_HOST_GATE: ${{ steps.g4_host.outcome }}
          G4_HOST_CONFIGURE_GATE: ${{ steps.g4_host_configure.outcome }}
          G4_STARTUP_GATE: ${{ steps.g4_startup.outcome }}
          G5_HOST_GATE: ${{ steps.g5_host.outcome }}
          G6_HOST_GATE: ${{ steps.g6_host.outcome }}
          SDK_PROBE_GATE: ${{ steps.sdk_probe.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          evidence = Path(os.environ['EVIDENCE'])
          build = Path(os.environ['BUILD_DIR'])
          evidence.mkdir(parents=True, exist_ok=True)
          if build.is_dir():
              for path in build.rglob('*'):
                  if path.is_file() and (path.name in {'CMakeCache.txt', 'compile_commands.json',
                          'CMakeConfigureLog.yaml', 'CMakeError.log', 'CMakeOutput.log',
                          'g1c-host-products-Release.txt', 'openmw-textured-nif-check', 'openmw-nif-geometry-check', 'openmw-nif-parse-check'}
                          or 'evidence' in path.relative_to(build).parts
                          or path.parent.name == 'generated'):
                      target = evidence / 'build' / path.relative_to(build)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
          for extra in (Path(os.environ['RUNNER_TEMP'])/'g4-device-build',Path(os.environ['RUNNER_TEMP'])/'g4-host-build'):
              if extra.is_dir():
                  for path in extra.rglob('*'):
                      if path.is_file() and path.name in {'CMakeCache.txt','compile_commands.json','CMakeConfigureLog.yaml','CMakeError.log','CMakeOutput.log','MeshBridge.cpp','WorldMesh.cpp','MaterialShader.hpp','osg-include.txt','LastTest.log','link.txt','g3-product-Release.txt','g4-product-Release.txt','g4-build.json','g4-environment.json','g4-dependencies.json','shader-provenance.json','g5-product-Release.txt','g5-build.json','g5-engine.json','engine-projection.json','frontend-view.json','g6-config-Release.json','g6-product-Release.txt','g6-build.json','g6-engine.json','g6-mygui-view.json','projection.json','renderer-view.json','g6-live-cases.json','g6-world-cases.json','g6-render-cases.json','g4-startup-case.json','g4-world-cases.json','g5-store-cases.json','g5-world-cases.json','openmw-world-check','openmw-g4-startup-check'}:
                          target=evidence/'g4-build'/extra.name/path.relative_to(extra)
                          target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
          status = {'gates': {name: os.environ.get(name, 'not-run') for name in
                    ('SOURCE_GATE', 'BULLET_GATE', 'CONFIGURE_GATE', 'BUILD_GATE', 'RUNTIME_GATE', 'G4_HOST_CONFIGURE_GATE', 'G4_STARTUP_GATE', 'G5_HOST_GATE', 'G6_HOST_GATE', 'G4_HOST_GATE', 'SDK_PROBE_GATE')},
                    'gpu_rendering': 'not-performed', 'iphoneos_build': 'not-performed',
                    'ipa_packaging': 'not-performed', 'physical_device': 'not-performed'}
          (evidence / 'job-status.json').write_text(json.dumps(status, indent=2) + '\n')
          (evidence / 'SHA256SUMS').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()
              + '  ' + p.relative_to(evidence).as_posix() for p in sorted(evidence.rglob('*'))
              if p.is_file() and p.name != 'SHA256SUMS') + '\n')
          PY

      - name: Upload host-only evidence including failures
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: openmw-g6-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openmw-g4-host-evidence/
          if-no-files-found: error
          retention-days: 14

  angle-device:
    needs: host-regressions
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize ANGLE failure evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g1c-angle-evidence"
          printf 'EVIDENCE=%s\nANGLE_ROOT=%s\n' "$RUNNER_TEMP/g1c-angle-evidence" "$RUNNER_TEMP/g1c-angle-device" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: openmw
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Bind ANGLE cache to exact source recipe and current Apple toolchain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          def read(*args):
              return subprocess.check_output(args, text=True).strip()
          context = {
              'schema': 1,
              'source_tree': read('git', '-C', os.environ['OPENMW_SOURCE'], 'rev-parse', 'HEAD:experiments/ios-angle-smoke'),
              'xcode': read('xcodebuild', '-version'),
              'sdk': read('xcrun', '--sdk', 'iphoneos', '--show-sdk-version'),
              'sdk_build': read('xcrun', '--sdk', 'iphoneos', '--show-sdk-build-version'),
              'clang': read('xcrun', '--sdk', 'iphoneos', 'clang', '--version'),
              'host': platform.platform(), 'architecture': platform.machine(),
              'runner_image': os.environ.get('ImageVersion', 'unknown'),
          }
          data = json.dumps(context, sort_keys=True).encode()
          (Path(os.environ['EVIDENCE'])/'angle-cache-context.json').write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('ANGLE_CACHE_KEY=g4-angle-device-v1-' + hashlib.sha256(data).hexdigest() + '\n')
          PY
      - name: Restore exact ANGLE package (always revalidate inventory and SDK)
        id: angle_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/g1c-angle-device
          key: ${{ env.ANGLE_CACHE_KEY }}
      - name: Build or independently revalidate exact locked ANGLE Metal package
        id: angle
        env:
          ANGLE_CACHE_HIT: ${{ steps.angle_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ios-port
          if test "$ANGLE_CACHE_HIT" = true; then
            # Check the saved inventory BEFORE validate_dependency regenerates it.
            python3 "$OPENMW_SOURCE/experiments/ios-angle-smoke/tools/validate_dependency.py" \
              --root "$ANGLE_ROOT" --resolve "$EVIDENCE/cached-angle.cmake" 2>&1 | tee "$EVIDENCE/angle-cache-inventory.log"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          context=json.loads((Path(os.environ['EVIDENCE'])/'angle-cache-context.json').read_text())
          built=json.loads((Path(os.environ['ANGLE_ROOT'])/'angle-build.json').read_text())['toolchain']
          if any(built[name].strip()!=context[name] for name in ('xcode','sdk','host')):
              raise ValueError('Cached ANGLE toolchain provenance differs')
          PY
          else
            python3 -u "$OPENMW_SOURCE/experiments/ios-angle-smoke/tools/build_angle.py" \
              --workspace "$RUNNER_TEMP/g1c-angle-work" --output "$ANGLE_ROOT" --allow-downloads --jobs 3 \
              2>&1 | tee "$EVIDENCE/angle-build.log"
          fi
          python3 "$OPENMW_SOURCE/experiments/ios-angle-smoke/tools/validate_dependency.py" \
            --root "$ANGLE_ROOT" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            2>&1 | tee "$EVIDENCE/angle-validation.log"
          tar -czf "$EVIDENCE/g1c-angle-device.tar.gz" -C "$RUNNER_TEMP" g1c-angle-device
          test -s "$EVIDENCE/g1c-angle-device.tar.gz"
          shasum -a 256 "$EVIDENCE/g1c-angle-device.tar.gz" > "$EVIDENCE/archive-sha256.txt"
      - name: Preserve available ANGLE failure diagnostics
        if: always()
        env:
          ANGLE_GATE: ${{ steps.angle.outcome }}
        run: |
          set -euo pipefail
          printf 'ANGLE gate: %s; physical execution not performed\n' "$ANGLE_GATE" > "$EVIDENCE/job-status.txt"
          for file in args.gn build.ninja toolchain.ninja; do
            source="$RUNNER_TEMP/g1c-angle-work/angle/out/ios-angle-arm64/$file"
            if test -f "$source"; then cp "$source" "$EVIDENCE/"; fi
          done
          if test -f "$ANGLE_ROOT/angle-build.json"; then cp "$ANGLE_ROOT/angle-build.json" "$EVIDENCE/"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g1c-angle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g1c-angle-evidence/
          if-no-files-found: error
          retention-days: 14

  iphoneos-geometry:
    needs: [host-regressions, angle-device]
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize native failure evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g4-native-evidence"
          printf 'EVIDENCE=%s\nBUILD_DIR=%s\nBULLET_ROOT=%s\nANGLE_ROOT=%s\nOSG_RENDERER=%s\n' \
            "$RUNNER_TEMP/g4-native-evidence" "$RUNNER_TEMP/g2-native-build" "$RUNNER_TEMP/g2-native-bullet" \
            "$RUNNER_TEMP/g1c-angle-device" "$RUNNER_TEMP/g1b-osg-renderer" >> "$GITHUB_ENV"
      - name: Check out requested source and provenance history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: openmw
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out clean pinned audit reference
        uses: actions/checkout@v6
        with:
          repository: OpenMW/osg
          ref: 9b384d5439977784e5cd250ff8ff7966928ddd27
          path: osg-pinned
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Audit preservation and source provenance
        id: sources
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ios-port
          test "$(git -C "$OPENMW_SOURCE" rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild -version > "$EVIDENCE/xcode-version.txt"
          xcrun --sdk iphoneos --show-sdk-version > "$EVIDENCE/sdk-version.txt"
          python3 "$OPENMW_SOURCE/$EXPERIMENT/device/tools/provenance.py" audit \
            --osg-reference "$OPENMW_ESM_OSG_SOURCE" > "$EVIDENCE/source-audit.json" 2> "$EVIDENCE/source-audit-errors.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$EXPERIMENT/device/tools" -p test_g1b.py -v \
            2>&1 | tee "$EVIDENCE/offline-tests.log"
      - name: Restore source archives only (every SHA-512 is rechecked)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # official v5
        with:
          path: ${{ runner.temp }}/openmw-g4-dependencies/*.zip
          key: g4-source-v1-${{ hashFiles('openmw/experiments/ios-openmw-world-smoke/dependencies.json') }}
      - name: Verify G4 sources and regressions; acquire exact upstream source inputs
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$WORLD/tools/paths.py" > "$EVIDENCE/g4-preservation.json"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$WORLD/tools" -p test_g4.py -v 2>&1 | tee "$EVIDENCE/g4-offline.log"
          python3 "$OPENMW_SOURCE/$WORLD/tools/prepare_dependencies.py" --output "$RUNNER_TEMP/openmw-g4-dependencies" \
            > "$EVIDENCE/g4-dependencies.json" 2> "$EVIDENCE/g4-dependency-errors.log"
      - uses: actions/download-artifact@v4
        with:
          name: g1c-angle-${{ github.run_id }}-${{ github.run_attempt }}
          path: angle-artifact
      - name: Restore and independently revalidate exact ANGLE device package
        id: angle
        run: |
          set -euo pipefail
          test -s angle-artifact/g1c-angle-device.tar.gz
          tar -xzf angle-artifact/g1c-angle-device.tar.gz -C "$RUNNER_TEMP"
          python3 "$OPENMW_SOURCE/experiments/ios-angle-smoke/tools/validate_dependency.py" \
            --root "$ANGLE_ROOT" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" 2>&1 | tee "$EVIDENCE/restored-angle-sdk.log"
          python3 "$OPENMW_SOURCE/experiments/ios-angle-smoke/tools/validate_dependency.py" \
            --root "$ANGLE_ROOT" --resolve "$EVIDENCE/angle-restored.cmake" 2>&1 | tee "$EVIDENCE/restored-angle-inventory.log"
      - name: Acquire unchanged Bullet and prepare separate v2 OSG renderer copy
        id: dependencies
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/experiments/ios-openmw-nif-smoke/tools/prepare_bullet.py" --download \
            --output "$BULLET_ROOT" --evidence "$EVIDENCE" 2>&1 | tee "$EVIDENCE/bullet-acquisition.log"
          python3 -u "$OPENMW_SOURCE/$EXPERIMENT/device/baseline/tools/prepare_osg.py" \
            --source "$OSG_RENDERER" --allow-downloads 2>&1 | tee "$EVIDENCE/osg-preparation.log"
          cp "$OSG_RENDERER/ios-osg-overlay.json" "$EVIDENCE/"
      - name: Configure exactly one GLES3 iPhoneOS provider and genuine parser
        id: configure
        run: |
          set -euo pipefail
          cmake -S "$OPENMW_SOURCE/$TEXTURED/device" -B "$BUILD_DIR" -G 'Unix Makefiles' \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DANGLE_ROOT="$ANGLE_ROOT" -DOSG_SOURCE="$OSG_RENDERER" \
            -DOPENMW_ESM_OSG_SOURCE="$OPENMW_ESM_OSG_SOURCE" -DG0_BULLET_SOURCE="$BULLET_ROOT/source" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$EVIDENCE/configure.log"
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/resources.py" configured \
            --osg-reference "$OPENMW_ESM_OSG_SOURCE" --build "$BUILD_DIR" --bullet "$BULLET_ROOT/source" \
            > "$EVIDENCE/configured-audit.json" 2> "$EVIDENCE/configured-audit-errors.log"
          test "$(wc -l < "$BUILD_DIR/g1c-products-Release.txt")" -eq 3
          printf 'LINK_PRODUCT=%s\nAPP_PRODUCT=%s\nAPP_BUNDLE=%s\n' \
            "$(sed -n '1p' "$BUILD_DIR/g1c-products-Release.txt")" \
            "$(sed -n '2p' "$BUILD_DIR/g1c-products-Release.txt")" \
            "$(sed -n '3p' "$BUILD_DIR/g1c-products-Release.txt")" >> "$GITHUB_ENV"
      - name: Configure G4 genuine world application
        id: g4_configure
        run: |
          set -euo pipefail
          REAL="$OPENMW_SOURCE/$WORLD"
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/preserve.py" > "$EVIDENCE/g5-preservation.json"
          python3 "$OPENMW_SOURCE/$ENGINE/tools/acquire.py" --output "$RUNNER_TEMP/openmw-g5-dependencies" > "$EVIDENCE/g5-lua-source.log"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/dependencies.py" --output "$RUNNER_TEMP/openmw-g6-dependencies" > "$EVIDENCE/g6-source-dependencies.json"
          G6_MYGUI_HEADERS="$RUNNER_TEMP/openmw-g4-dependencies/mygui/MyGUIEngine/include" python3 -m unittest discover -s "$OPENMW_SOURCE/$LIVEWORLD/tools" -p test_g6.py -v 2>&1 | tee "$EVIDENCE/g6-offline.log"
          python3 -m unittest discover -s "$OPENMW_SOURCE/$ENGINE/tools" -p test_g5.py -v 2>&1 | tee "$EVIDENCE/g5-offline.log"
          cmake -S "$REAL/device" -B "$REAL_BUILD" -G 'Unix Makefiles' \
            -DCMAKE_PROJECT_OpenMWWorldDevice_INCLUDE="$OPENMW_SOURCE/$LIVEWORLD/cmake/attach_device.cmake" \
            -DG5_LUA_SOURCE="$RUNNER_TEMP/openmw-g5-dependencies/lua-5.4.9" \
            -DG6_DEPENDENCIES_SOURCE="$RUNNER_TEMP/openmw-g6-dependencies" \
            -DG4_DEPENDENCIES_SOURCE="$RUNNER_TEMP/openmw-g4-dependencies" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DANGLE_ROOT="$ANGLE_ROOT" -DOSG_SOURCE="$OSG_RENDERER" \
            -DOPENMW_ESM_OSG_SOURCE="$OPENMW_ESM_OSG_SOURCE" -DG0_BULLET_SOURCE="$BULLET_ROOT/source" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$EVIDENCE/g4-configure.log"
          python3 "$REAL/tools/provenance.py" --configured "$REAL_BUILD" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" > "$EVIDENCE/g4-configured-audit.json" 2> "$EVIDENCE/g4-configured-audit-errors.log"
      - name: Early genuine G5 engine and UIKit Apple consumer gate
        id: g5_preflight
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$ENGINE/tools/native_preflight.py" --build "$RUNNER_TEMP/g4-device-build" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/g5-early-compile" > "$EVIDENCE/g5-early-compile.json" 2> "$EVIDENCE/g5-early-errors.log"
      - name: Early G6 genuine live ownership, Scene interfaces and dependency platform gate
        id: g6_preflight
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/native_preflight.py" --build "$RUNNER_TEMP/g4-device-build" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/g6-early-compile" \
            > "$EVIDENCE/g6-early-compile.json" 2> "$EVIDENCE/g6-early-errors.log"

      - name: Verify native dependency archives, compile new OSG targets and link registrations
        id: g4_preflight
        run: |
          set -euo pipefail
          REAL="$OPENMW_SOURCE/$WORLD"
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          python3 "$REAL/tools/native_preflight.py" --build "$REAL_BUILD" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/g4-early-compile" > "$EVIDENCE/g4-early-compile.json" 2> "$EVIDENCE/g4-early-compile-errors.log"
      - name: Compile and link genuine device geometry executable
        id: link
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target openmw-textured-nif-check --parallel 3 2>&1 | tee "$EVIDENCE/link-build.log"
          test -f "$LINK_PRODUCT" && test ! -L "$LINK_PRODUCT"
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/package_textured.py" link --product "$LINK_PRODUCT" \
            --prepared "$BUILD_DIR/prepared" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --evidence "$EVIDENCE"
      - name: Compile and link UIKit textured NIF application
        id: app
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target IOSOpenMWTexturedNif --parallel 3 2>&1 | tee "$EVIDENCE/app-build.log"
          test -f "$APP_PRODUCT" && test ! -L "$APP_PRODUCT"
          test "$(xcrun lipo -archs "$APP_PRODUCT")" = arm64
          xcrun vtool -show-build "$APP_PRODUCT" > "$EVIDENCE/app-platform.txt"
          shasum -a 256 "$APP_PRODUCT" > "$EVIDENCE/app-executable-sha256.txt"
      - name: Inspect native dependencies and exact complete application inventory
        id: bundle
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/package_textured.py" bundle --product "$APP_BUNDLE" \
            --prepared "$BUILD_DIR/prepared" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --evidence "$EVIDENCE"
      - name: Package validated unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/package_textured.py" ipa --product "$APP_BUNDLE" \
            --prepared "$BUILD_DIR/prepared" --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --evidence "$EVIDENCE" \
            --output "$EVIDENCE/IOSOpenMWTexturedNif-unsigned.ipa"
      - name: Independently reopen IPA and repeat all binary and resource checks
        id: reopen
        run: |
          set -euo pipefail
          python3 "$OPENMW_SOURCE/$TEXTURED/tools/package_textured.py" reopen \
            --product "$EVIDENCE/IOSOpenMWTexturedNif-unsigned.ipa" --prepared "$BUILD_DIR/prepared" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --evidence "$EVIDENCE"
      - name: Compile and link genuine G4 world UIKit application
        id: g4_build
        run: |
          set -euo pipefail
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          cmake --build "$REAL_BUILD" --target IOSOpenMWWorld --parallel 3 2>&1 | tee "$EVIDENCE/g4-app-build.log"
      - name: Validate executable and exact public bundle; package and independently reopen IPA
        id: g4_package
        run: |
          set -euo pipefail
          REAL="$OPENMW_SOURCE/$WORLD"
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          test "$(wc -l < "$REAL_BUILD/g4-product-Release.txt")" -eq 3
          EXECUTABLE=$(sed -n '1p' "$REAL_BUILD/g4-product-Release.txt")
          test -f "$EXECUTABLE" && test ! -L "$EXECUTABLE"
          APP=$(sed -n '2p' "$REAL_BUILD/g4-product-Release.txt")
          PREPARED=$(sed -n '3p' "$REAL_BUILD/g4-product-Release.txt")
          python3 "$REAL/tools/package.py" --app "$APP" --prepared "$PREPARED" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/IOSOpenMWWorld-unsigned.ipa" > "$EVIDENCE/g4-package.json" 2> "$EVIDENCE/g4-package-errors.log"

      - name: Compile and validate genuine G5 engine application and reopened IPA
        id: g5_package
        run: |
          set -euo pipefail
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          cmake --build "$REAL_BUILD" --target IOSOpenMWEngine --parallel 3 2>&1 | tee "$EVIDENCE/g5-app-build.log"
          test "$(wc -l < "$REAL_BUILD/g5-product-Release.txt")" -eq 3
          EXECUTABLE=$(sed -n '1p' "$REAL_BUILD/g5-product-Release.txt")
          APP=$(sed -n '2p' "$REAL_BUILD/g5-product-Release.txt")
          PREPARED=$(sed -n '3p' "$REAL_BUILD/g5-product-Release.txt")
          test -f "$EXECUTABLE" && test ! -L "$EXECUTABLE"
          test "$(xcrun lipo -archs "$EXECUTABLE")" = arm64
          otool -l "$EXECUTABLE" > "$EVIDENCE/g5-platform.txt"
          otool -L "$EXECUTABLE" > "$EVIDENCE/g5-dependencies.txt"
          python3 "$OPENMW_SOURCE/$ENGINE/tools/package.py" --app "$APP" --prepared "$PREPARED" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/IOSOpenMWEngine-unsigned.ipa" > "$EVIDENCE/g5-package.json" 2> "$EVIDENCE/g5-package-errors.log"
      - name: Compile and validate genuine G6 live-world application and reopened IPA
        id: g6_package
        run: |
          set -euo pipefail
          REAL_BUILD="$RUNNER_TEMP/g4-device-build"
          cmake --build "$REAL_BUILD" --target IOSOpenMWLiveWorld --parallel 3 2>&1 | tee "$EVIDENCE/g6-app-build.log"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/native_preflight.py" --build "$REAL_BUILD" --final-archives > "$EVIDENCE/g6-final-archives.json"
          test "$(wc -l < "$REAL_BUILD/g6-product-Release.txt")" -eq 3
          EXECUTABLE=$(sed -n '1p' "$REAL_BUILD/g6-product-Release.txt")
          APP=$(sed -n '2p' "$REAL_BUILD/g6-product-Release.txt")
          PREPARED=$(sed -n '3p' "$REAL_BUILD/g6-product-Release.txt")
          test -f "$EXECUTABLE" && test -x "$EXECUTABLE" && test ! -L "$EXECUTABLE"
          otool -l "$EXECUTABLE" > "$EVIDENCE/g6-platform.txt"
          otool -L "$EXECUTABLE" > "$EVIDENCE/g6-dependencies.txt"
          python3 "$OPENMW_SOURCE/$LIVEWORLD/tools/package.py" --app "$APP" --prepared "$PREPARED" \
            --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --output "$EVIDENCE/IOSOpenMWLiveWorld-unsigned.ipa" \
            > "$EVIDENCE/g6-package.json" 2> "$EVIDENCE/g6-package-errors.log"

      - name: Retain native diagnostics and separate gate outcomes on failure
        if: always()
        env:
          SOURCE_GATE: ${{ steps.sources.outcome }}
          ANGLE_GATE: ${{ steps.angle.outcome }}
          DEPENDENCY_GATE: ${{ steps.dependencies.outcome }}
          CONFIGURE_GATE: ${{ steps.configure.outcome }}
          LINK_GATE: ${{ steps.link.outcome }}
          APP_GATE: ${{ steps.app.outcome }}
          BUNDLE_GATE: ${{ steps.bundle.outcome }}
          IPA_GATE: ${{ steps.ipa.outcome }}
          REOPEN_GATE: ${{ steps.reopen.outcome }}
          G4_CONFIGURE_GATE: ${{ steps.g4_configure.outcome }}
          G4_PREFLIGHT_GATE: ${{ steps.g4_preflight.outcome }}
          G4_BUILD_GATE: ${{ steps.g4_build.outcome }}
          G4_PACKAGE_GATE: ${{ steps.g4_package.outcome }}
          G5_PACKAGE_GATE: ${{ steps.g5_package.outcome }}
          G5_PREFLIGHT_GATE: ${{ steps.g5_preflight.outcome }}
          G6_PREFLIGHT_GATE: ${{ steps.g6_preflight.outcome }}
          G6_PACKAGE_GATE: ${{ steps.g6_package.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          evidence, build = Path(os.environ['EVIDENCE']), Path(os.environ['BUILD_DIR'])
          evidence.mkdir(parents=True, exist_ok=True)
          if build.is_dir():
              for path in build.rglob('*'):
                  if path.is_file() and (path.name in {'CMakeCache.txt', 'compile_commands.json', 'CMakeConfigureLog.yaml',
                          'CMakeError.log', 'CMakeOutput.log', 'g1c-products-Release.txt'}
                          or 'prepared' in path.relative_to(build).parts or path.name in
                          {'openmw-textured-nif-check', 'IOSOpenMWTexturedNif'}):
                      target = evidence / 'build' / path.relative_to(build)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(path, target)
          for extra in (Path(os.environ['RUNNER_TEMP'])/'g4-device-build',Path(os.environ['RUNNER_TEMP'])/'g4-host-build'):
              if extra.is_dir():
                  for path in extra.rglob('*'):
                      if path.is_file() and path.name in {'CMakeCache.txt','compile_commands.json','CMakeConfigureLog.yaml','CMakeError.log','CMakeOutput.log','MeshBridge.cpp','WorldMesh.cpp','MaterialShader.hpp','osg-include.txt','LastTest.log','link.txt','g3-product-Release.txt','g4-product-Release.txt','g4-build.json','g4-environment.json','g4-dependencies.json','shader-provenance.json','g5-product-Release.txt','g5-build.json','g5-engine.json','engine-projection.json','frontend-view.json','g6-config-Release.json','g6-product-Release.txt','g6-build.json','g6-engine.json','g6-mygui-view.json','projection.json','renderer-view.json','g6-live-cases.json','g6-world-cases.json','g6-render-cases.json'}:
                          target=evidence/'g4-build'/extra.name/path.relative_to(extra)
                          target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,target)
          status = {'gates': {name: os.environ.get(name, 'not-run') for name in ('SOURCE_GATE', 'ANGLE_GATE',
                    'DEPENDENCY_GATE', 'CONFIGURE_GATE', 'LINK_GATE', 'APP_GATE', 'BUNDLE_GATE', 'IPA_GATE', 'REOPEN_GATE',
                    'G4_CONFIGURE_GATE', 'G4_PREFLIGHT_GATE', 'G4_BUILD_GATE', 'G4_PACKAGE_GATE', 'G5_PACKAGE_GATE', 'G5_PREFLIGHT_GATE', 'G6_PREFLIGHT_GATE', 'G6_PACKAGE_GATE')},
                    'shader_execution': 'not-performed by CI', 'displayed_triangle': 'not-observed',
                    'gpu_completion': 'unverified', 'lifecycle_recovery': 'unverified', 'device_acceptance': 'unverified'}
          (evidence / 'job-status.json').write_text(json.dumps(status, indent=2) + '\n')
          (evidence / 'SHA256SUMS').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  '
              + p.relative_to(evidence).as_posix() for p in sorted(evidence.rglob('*'))
              if p.is_file() and p.name != 'SHA256SUMS') + '\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: g6-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g4-native-evidence/
          if-no-files-found: error
          retention-days: 14
